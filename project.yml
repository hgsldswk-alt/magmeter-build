name: MagMeter
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, ja]
settings:
  base:
    APP_ID: com.hgsldswk.magmeter
    APP_STORE_ID: "6837839664"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  MagMeter:
    type: application
    platform: iOS
    sources: [MagMeter, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: MagMeter AppStore
    info:
      path: MagMeter/Info.plist
      properties:
        CFBundleDisplayName: Magnetic Field
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: Measure magnetic field strength and check whether the phone is held at a similar angle.
        APP_STORE_ID: $(APP_STORE_ID)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.magmeter.preset
            UTTypeDescription: Magnetic Field Preset
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [magmeterpreset]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Magnetic Field Preset
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.magmeter.preset]
        LSSupportsOpeningDocumentsInPlace: true
  MagMeterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MagMeterTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  MagMeterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MagMeterUITests]
    dependencies:
      - target: MagMeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MagMeter
schemes:
  MagMeter:
    build:
      targets:
        MagMeter: all
        MagMeterTests: [test]
    test:
      config: Debug
      targets: [MagMeterTests]
  MagMeterUI:
    build:
      targets:
        MagMeter: all
        MagMeterUITests: [test]
    test:
      config: Debug
      targets: [MagMeterUITests]
